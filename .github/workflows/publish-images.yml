name: Publish container images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish images
        run: |
          docker build --file Dockerfile --tag ghcr.io/hubertoink/bouldero-web:latest .
          docker push ghcr.io/hubertoink/bouldero-web:latest
          docker build --file api/Dockerfile --tag ghcr.io/hubertoink/bouldero-api:latest .
          docker push ghcr.io/hubertoink/bouldero-api:latest
          docker build --file db/Dockerfile --tag ghcr.io/hubertoink/bouldero-db:latest db
          docker push ghcr.io/hubertoink/bouldero-db:latest
