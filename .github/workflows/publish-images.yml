name: Publish container images

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish images
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then TAG=latest; API_UPSTREAM=api; else TAG=dev; API_UPSTREAM=api-dev; fi
          docker build --build-arg API_UPSTREAM=$API_UPSTREAM --file Dockerfile --tag ghcr.io/hubertoink/bouldero-web:$TAG .
          docker push ghcr.io/hubertoink/bouldero-web:$TAG
          docker build --file api/Dockerfile --tag ghcr.io/hubertoink/bouldero-api:$TAG .
          docker push ghcr.io/hubertoink/bouldero-api:$TAG
          docker build --file db/Dockerfile --tag ghcr.io/hubertoink/bouldero-db:$TAG db
          docker push ghcr.io/hubertoink/bouldero-db:$TAG
