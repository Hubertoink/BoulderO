server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 55m;

    location /api/ {
        # Resolve the API service only when a request arrives.  This keeps the
        # web container alive when Docker restores it before the API after a
        # host restart (the service name may not be registered yet then).
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 5s;
        set $api_upstream __API_UPSTREAM__;

        # Keep the existing /api prefix stripping while using a variable
        # upstream; with a variable nginx otherwise cannot infer that rewrite.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream:3001;
        proxy_connect_timeout 3s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The app is a single-page application: unknown paths return the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can safely be cached for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
