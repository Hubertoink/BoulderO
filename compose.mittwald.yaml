services:
  bouldero:
    image: ghcr.io/hubertoink/bouldero-web:latest
    ports:
      - "80:80/tcp"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m

  api:
    image: ghcr.io/hubertoink/bouldero-api:latest
    ports:
      - "3001:3001/tcp"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://bouldero:${POSTGRES_PASSWORD}@db:5432/bouldero
      AUTH_SECRET: ${AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      UPLOAD_DIR: /app/uploads
    volumes:
      - bouldero_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m

  db:
    image: ghcr.io/hubertoink/bouldero-db:latest
    ports:
      - "5432:5432/tcp"
    environment:
      POSTGRES_DB: bouldero
      POSTGRES_USER: bouldero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - bouldero_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bouldero -d bouldero"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1g

volumes:
  bouldero_postgres:
  bouldero_uploads:
