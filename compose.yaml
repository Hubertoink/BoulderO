services:
  bouldero:
    build:
      context: .
      dockerfile: Dockerfile
    image: bouldero:local
    container_name: bouldero
    ports:
      - "8090:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://bouldero:${POSTGRES_PASSWORD:-bouldero-local-only}@db:5432/bouldero
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-before-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      UPLOAD_DIR: /app/uploads
    volumes:
      - bouldero_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.5-alpine
    environment:
      POSTGRES_DB: bouldero
      POSTGRES_USER: bouldero
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bouldero-local-only}
    volumes:
      - bouldero_postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bouldero -d bouldero"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  bouldero_postgres:
  bouldero_uploads:
